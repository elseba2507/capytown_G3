# RC-1 · Ganancias finales · capytown_G3
simulador:                                       # noise:=low, linear_speed 0.20, max_angular 2.0
  recta: {kp: 3.0, ki: 0.5, kd: 4.0}             # 1D: error final 0.21 cm, asentamiento 5.2 s
  giro:  {kp_yaw: 5.0, ki_yaw: 0.0, kd_yaw: 0.4} # 2e: sobreimpulso 0 %, asentamiento 1.59 s

robot_real:                                      # roscar8, ROS_DOMAIN_ID 8, /odom de odom_corrector (11 Hz, sin EKF)
  recta: {kp: 2.0, ki: 0.0, kd: 4.0}             # re-sintonía 2: ki 0.5 -> 0 (wind-up) | re-sintonía 3: kp 3 -> 2
  giro:  {kp_yaw: 5.0, ki_yaw: 0.0, kd_yaw: 0.4} # igual que en el simulador: 0°, 0°, 0° con transportador
  velocidades: {linear_speed: 0.10, max_angular: 0.5}   # re-sintonía 1: max_angular 1.0 -> 0.5 (derrape)
  calibracion: {wheel_radius: 0.0311, wheel_separation: 0.2132}  # b_eff 0.2259 -> 0.2132 (wheel_params_rc1.yaml)
